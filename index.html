<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>من أحمد إلى زهرة ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fffaf6; --blush:#fde8ec; --rose:#e0758d; --rose-deep:#c4506b;
  --gold:#c9a96e; --ink:#2e2a2b; --soft:#7a6e71;
  --serif:"Amiri","Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --sans:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);color:var(--ink);
  background:radial-gradient(circle at 20% 10%,var(--blush) 0,transparent 45%),
             radial-gradient(circle at 85% 90%,#fbeee0 0,transparent 40%),var(--ivory);
  height:100dvh;
}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.float{position:absolute;bottom:-40px;opacity:0;animation:rise linear forwards}
@keyframes rise{10%{opacity:.5}90%{opacity:.25}100%{transform:translateY(-110dvh) translateX(var(--dx));opacity:0}}
#app{position:relative;z-index:1;height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}
.card{
  width:100%;max-width:460px;max-height:92dvh;overflow-y:auto;text-align:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(201,169,110,.35);border-radius:28px;padding:34px 22px 28px;
  box-shadow:0 20px 60px -20px rgba(196,80,107,.25);
  animation:in .8s var(--ease) both;
}
.card.out{animation:out .5s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-22px) scale(.97)}}
.card.plain{background:none;border:0;box-shadow:none;backdrop-filter:none}
.title{font-family:var(--serif);font-size:clamp(34px,10vw,46px);line-height:1.5;font-weight:700;color:var(--rose-deep)}
.q{font-family:var(--serif);font-size:clamp(23px,6.6vw,29px);line-height:1.7;font-weight:700;margin-bottom:24px}
.sub{font-size:18px;line-height:1.9;color:var(--soft);margin:14px 0 26px}
.rule{width:56px;height:1px;background:var(--gold);margin:18px auto}
.opts{display:flex;flex-direction:column;gap:12px}
.opt,.btn{
  font-family:var(--sans);font-size:18px;font-weight:500;color:var(--ink);cursor:pointer;
  min-height:56px;padding:14px 18px;border-radius:18px;line-height:1.5;
  background:#fff;border:1px solid rgba(201,169,110,.45);
  transition:transform .3s var(--ease),box-shadow .3s,background .3s,border-color .3s;
}
.opt:hover,.opt:focus-visible{transform:translateY(-2px);border-color:var(--rose);box-shadow:0 10px 24px -12px rgba(224,117,141,.6);outline:none}
.opt:active{transform:scale(.97)}
.opt.picked{background:var(--rose);color:#fff;border-color:var(--rose)}
.opt.fade{opacity:.35;pointer-events:none}
.btn{background:linear-gradient(135deg,#ec8aa0,var(--rose-deep));color:#fff;border:0;font-size:20px;font-weight:700;padding:16px 40px;box-shadow:0 14px 30px -12px rgba(196,80,107,.7);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{left:130%}}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--rose-deep);border:1px solid var(--rose);box-shadow:none}
.btn.ghost::after{display:none}
.react{font-family:var(--serif);font-size:23px;line-height:1.8;color:var(--rose-deep);animation:in .7s var(--ease) both;padding:10px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt.play:nth-child(odd){transform:rotate(-1.5deg)}.opt.play:nth-child(even){transform:rotate(1.5deg)}
.word{font-family:var(--serif);font-size:25px;font-weight:700;min-height:92px;animation:bob 4s ease-in-out infinite}
.grid .word:nth-child(2){animation-delay:-1s}.grid .word:nth-child(3){animation-delay:-2s}.grid .word:nth-child(4){animation-delay:-3s}
@keyframes bob{50%{translate:0 -7px}}
.word.picked{animation:pop .8s var(--ease) forwards}
@keyframes pop{50%{transform:scale(1.2)}100%{transform:scale(1.06)}}
input[type=range]{width:100%;margin:26px 0 10px;accent-color:var(--rose);height:34px}
.big{font-size:60px;transition:transform .3s}
textarea{width:100%;min-height:110px;border-radius:18px;border:1px solid rgba(201,169,110,.5);padding:14px;font:18px/1.7 var(--sans);resize:none;background:#fff;color:var(--ink);margin-bottom:16px}
textarea:focus{outline:2px solid var(--rose)}
.line{opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s var(--ease);font-family:var(--serif);font-size:clamp(24px,7vw,32px);line-height:1.8;margin:10px 0}
.line.on{opacity:1;transform:none}
.heart{font-size:110px;line-height:1;cursor:pointer;display:inline-block;animation:beat 1.8s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(224,117,141,.5));border:0;background:none}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.letter{background:#fffdf9;border:1px solid rgba(201,169,110,.5);border-radius:6px;padding:28px 20px;text-align:right;font-family:var(--serif);font-size:20.5px;line-height:2.05;box-shadow:0 18px 50px -22px rgba(0,0,0,.25)}
.letter p{opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s var(--ease);margin-bottom:12px}
.letter p.on{opacity:1;transform:none}
.letter .quote{color:var(--rose-deep);font-weight:700;text-align:center;font-size:22px}
.letter .sig{text-align:left;color:var(--gold);font-size:22px}
.final-btns{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.scroll-card{max-height:94dvh}
#music{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5;display:none;align-items:center;gap:8px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border:1px solid rgba(201,169,110,.45);border-radius:30px;
  padding:6px 14px 6px 8px;font:500 14px var(--sans);color:var(--soft);cursor:pointer;direction:ltr}
#music b{width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:16px}
#music.playing b{animation:beat 2s infinite}
#glow{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(236,138,160,.35),transparent 65%);transition:opacity 1.5s}
#glow.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="glow"></div>
<button id="music" aria-label="Music"><b>♪</b><span id="mtxt">Playing...</span></button>
<main id="app"></main>

<script>
/* ============ DATA (easy to customize) ============ */
const music = new Audio("one.mp3");
music.loop = true;
music.volume = 0.35;

const STEPS = [
  { type:"choice", q:"زهورة... بصراحة؟ بعدج تحبين أحمد؟ ❤️", opts:[
    {t:"إي أحبّه ❤️", r:"وآني قلبي يضحك هسه... 🤍"},
    {t:"أحبه... بس زعلانة منه 🥺", r:"وهذا الشي بعد مفهوم، وآني أريد أسمعه. 🤍"},
    {t:"ما أدري 😶‍🌫️", r:"عادي زهورة... خلي نكتشف سوا. 🤍"}]},
  { type:"choice", q:"زين... شنو أكثر شي مزعلج من أحمد؟ 🥺", opts:[
    {t:"أحس مرات يخفي عني أشياء."},
    {t:"أحس ما أعرف كلشي عنه."},
    {t:"أحتاج أحس بالأمان أكثر وياه."},
    {t:"مجرد متضايقة وأحتاجه يفهمني."}], r:"شكراً لأنج گلتيها... هذا يهمني. 🤍"},
  { type:"choice", q:"برأيج... الثقة تنبني بكلمة لو بالأفعال؟ 🤍", opts:[
    {t:"بالأفعال."},{t:"بالاثنين."},{t:"ما أعرف... بس أريد أحسها."}],
    r:"يمكن الثقة مو كلمة نكولها... الثقة شعور يتكرر كل يوم، من خلال التفاصيل الصغيرة.", long:true},
  { type:"slider", q:"من 0 لـ 100... شكد قلبج مرتاح هسه؟" },
  { type:"choice", q:"إذا أحمد يريد يرجع يبني الثقة وياج... شنو أهم شي يحتاج يسويه؟ 🤍", opts:[
    {t:"يكون صريح وياي."},{t:"ما يخلي عندي مجال للشك."},
    {t:"يسمعني ويفهم خوفي."},{t:"يثبتلي بأفعاله."}], r:"مسجّلها بقلبي. 🤍"},
  { type:"choice", play:true, q:"وإذا أحمد هسه گال لج: آني مستعد أصلح كلشي... شتسوين؟ 👀❤️", opts:[
    {t:"أنطيه فرصة.", r:"😳❤️ هسه آني اللي خجلان!"},
    {t:"أخليه يثبتلي أول.", r:"وهذا حقج... وآني جاهز. 🤍"},
    {t:"أكله تعال نحچي.", r:"وآني أول واحد يسمعج. 🫶🏻"},
    {t:"بعدني زعلانة 😤❤️", r:"حقج... وآني ماني رايح مكان. 😅❤️"}]},
  { type:"words" },
  { type:"choice", q:"إذا الحب موجود... برأيج شنو الشي اللي لازم يبقى موجود وياه؟", opts:[
    {t:"الثقة 🤍"},{t:"الصراحة 🫶🏻"},{t:"الأمان 🥺"},{t:"كلهم ❤️"}], r:"وآني أريد أكون الشخص اللي يحافظ عليهم. 🤍"},
  { type:"text", q:"إذا تريدين تكولين لأحمد شي بس... شنو يكون؟" },
  { type:"transition" },
  { type:"letter" },
  { type:"final" }
];
const WORDS = ["حب ❤️","ثقة 🤍","أمان 🫂","فرصة ثانية 🌷"];
const LETTER = [
  "زهورة،",
  "آني أعرف إن گول «ثقي بي» ما يكفي، وأعرف إن الثقة ما تنطلب... تنكسب.",
  "quote:الحب وحده حلو... بس الحب من يصير وياه أمان وثقة، يصير وطن.",
  "زهورة، آني ما أريد منج تنسين زعلج بكلمة، ولا أريد أطلب منج تثقين بي بس لأن آني گلت لج ثقي بي. أريد أخلي أفعالي هي اللي تحچي عني. إذا أكو شي خلاج تشكين أو تخافين، آني أريد أفهمه، مو أهرب منه. لأنج بالنسبة إلي مو شخص أخاف أخسره وبس... إنتِ شخص أريد أحافظ عليه، وأريدج تحسين وياي بالأمان قبل أي شي ثاني.",
  "sig:أحمد 🤍"
];

/* ============ STATE & HELPERS ============ */
const app = document.getElementById("app");
const bg = document.getElementById("bg");
const answers = [];
let idx = -1, busy = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
const el = (html, cls="card") => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; return d; };

function floatHeart(emoji="🤍", size=null, dur=null){
  const s = document.createElement("span");
  s.className = "float"; s.textContent = emoji;
  s.style.left = Math.random()*100 + "vw";
  s.style.fontSize = (size || 12 + Math.random()*16) + "px";
  s.style.setProperty("--dx", (Math.random()*60-30) + "px");
  s.style.animationDuration = (dur || 9 + Math.random()*9) + "s";
  bg.appendChild(s); setTimeout(() => s.remove(), 20000);
}
let ambient = setInterval(() => floatHeart(["🤍","·","✦","🌸"][Math.floor(Math.random()*4)]), 1400);
function burst(n=40){
  for(let i=0;i<n;i++) setTimeout(() => floatHeart(["❤️","🤍","🌷","✨","💗"][i%5], 18+Math.random()*26, 4+Math.random()*4), i*80);
}
function chime(){ /* Web Audio romantic arpeggio, no extra file */
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i*0.16;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.04); g.gain.exponentialRampToValueAtTime(.001,t+1.6);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+1.7);
    });
  }catch(e){}
}

/* ============ MUSIC ============ */
function playMusic(){
  music.play().catch(()=>{});
  const m = document.getElementById("music"); m.style.display = "flex"; m.classList.add("playing");
}
function toggleMusic(){
  music.muted = !music.muted;
  const m = document.getElementById("music");
  m.classList.toggle("playing", !music.muted);
  document.getElementById("mtxt").textContent = music.muted ? "Muted" : "Playing...";
}
document.getElementById("music").addEventListener("click", toggleMusic);

/* ============ FLOW ============ */
async function mount(node){
  const old = app.firstElementChild;
  if(old){ old.classList.add("out"); await wait(480); old.remove(); }
  app.appendChild(node);
}
function intro(){
  mount(el(`
    <div class="title">من أحمد إلى زهرة ❤️</div>
    <div class="rule"></div>
    <p class="sub">هالمرة ما أريد أحچي... أريدج تجاوبين من قلبج.</p>
    <button class="btn" id="go">نبدأ؟ 🤍</button>`, "card plain"))
    .then(() => document.getElementById("go").onclick = startExperience);
}
function startExperience(){
  playMusic();
  nextQuestion();
}
function nextQuestion(){ idx++; busy = false; showQuestion(); }

function showQuestion(){
  const s = STEPS[idx];
  ({ choice:showChoice, slider:showSlider, words:showWords, text:showText,
     transition:showTransition, letter:showLetter, final:showFinal })[s.type](s);
}

function showChoice(s){
  const node = el(`<div class="q">${s.q}</div><div class="opts ${s.play?"playgrid":""}"></div><div id="rx"></div>`);
  const box = node.querySelector(".opts");
  s.opts.forEach((o,i) => {
    const b = document.createElement("button");
    b.className = "opt" + (s.play ? " play" : ""); b.textContent = o.t;
    b.onclick = async () => {
      if(busy) return; busy = true;
      answers.push(o.t); b.classList.add("picked");
      [...box.children].forEach(c => c!==b && c.classList.add("fade"));
      const r = o.r || s.r;
      if(r){ node.querySelector("#rx").innerHTML = `<div class="react">${r}</div>`; }
      await wait(s.long ? 4200 : 2100);
      nextQuestion();
    };
    box.appendChild(b);
  });
  mount(node);
}

function showSlider(s){
  const node = el(`<div class="q">${s.q}</div>
    <div class="big" id="em">🥺</div>
    <input type="range" min="0" max="100" value="30" id="sl">
    <div class="react" id="lb" style="min-height:70px"></div>
    <button class="btn" id="ok">كملنا 🤍</button>`);
  const em = node.querySelector("#em"), lb = node.querySelector("#lb"), sl = node.querySelector("#sl");
  const upd = () => {
    const v = +sl.value;
    em.textContent = v<25?"💔":v<50?"🥺":v<75?"🙂":"🥰";
    em.style.transform = `scale(${1+v/250})`;
    lb.textContent = v<25?"أسمعج... وأريد أصلحها.":v<50?"شوية شوية... آني وياج.":v<75?"حلو، قلبج بدا يهدأ.":"يا رب يدوم هالشعور. 🤍";
  };
  sl.oninput = upd; upd();
  mount(node).then(() => document.getElementById("ok").onclick = () => { answers.push(sl.value); nextQuestion(); });
}

function showWords(){
  const node = el(`<div class="q">هسه أريد منج تختارين كلمة وحدة توصف اللي بداخِلج...</div><div class="grid"></div>`);
  const g = node.querySelector(".grid");
  WORDS.forEach(w => {
    const b = document.createElement("button"); b.className = "opt word"; b.textContent = w;
    b.onclick = async () => {
      if(busy) return; busy = true; answers.push(w);
      b.classList.add("picked"); [...g.children].forEach(c => c!==b && c.classList.add("fade"));
      for(let i=0;i<6;i++) floatHeart("🤍",24,5);
      await wait(1800); nextQuestion();
    };
    g.appendChild(b);
  });
  mount(node);
}

function showText(s){
  const node = el(`<div class="q">${s.q}</div>
    <textarea id="tx" placeholder="اكتبي هنا... (اختياري)"></textarea>
    <div class="opts"><button class="btn" id="ok">كملنا 🤍</button>
    <button class="opt" id="skip">أفضّل أسكت هسه</button></div>`);
  mount(node).then(() => {
    const done = () => { answers.push(document.getElementById("tx").value); nextQuestion(); };
    document.getElementById("ok").onclick = done; document.getElementById("skip").onclick = done;
  });
}

async function showTransition(){
  clearInterval(ambient);
  const node = el(`<div class="line"></div><div class="line"></div><div class="line" style="color:var(--rose-deep)"></div>
    <div id="hz" style="margin-top:22px;opacity:0;transition:opacity 2s"></div>`, "card plain");
  const L = node.querySelectorAll(".line");
  L[0].textContent = "خلصت الأسئلة...";
  L[1].textContent = "بس أكو سؤال واحد بعدني ما سألتج إياه.";
  L[2].textContent = "هل بعد أكو مكان صغير بقلبج لأحمد؟ ❤️";
  await mount(node);
  await wait(900); L[0].classList.add("on");
  await wait(3200); L[1].classList.add("on");
  await wait(4200); L[2].classList.add("on");
  await wait(2600);
  const hz = node.querySelector("#hz"); hz.style.opacity = 1;
  hz.innerHTML = `<button class="heart" id="hb" aria-label="heart">❤️</button><p class="sub" style="margin-top:14px">اضغطي على القلب 🤍</p>`;
  document.getElementById("hb").onclick = async () => {
    document.getElementById("glow").classList.add("on"); burst(14);
    await wait(1800); nextQuestion();
  };
}

async function showLetter(){
  const html = LETTER.map(t => t.startsWith("quote:") ? `<p class="quote">${t.slice(6)}</p>`
    : t.startsWith("sig:") ? `<p class="sig">من ${t.slice(4)}</p>` : `<p>${t}</p>`).join("");
  const node = el(`<div class="letter">${html}</div><div style="margin-top:22px;opacity:0;transition:opacity 1.5s" id="nx">
    <button class="btn" id="ok">كملنا 🤍</button></div>`, "card plain scroll-card");
  await mount(node);
  ambient = setInterval(() => floatHeart("🤍"), 2200);
  const ps = node.querySelectorAll(".letter p");
  for(const p of ps){ await wait(1100); p.classList.add("on"); p.scrollIntoView({behavior:"smooth",block:"center"}); }
  await wait(1500);
  node.querySelector("#nx").style.opacity = 1;
  document.getElementById("ok").onclick = nextQuestion;
}

function showFinal(){
  const node = el(`<div class="title" style="font-size:clamp(30px,8.5vw,40px)">زهورة... تنطيني فرصة جديدة؟ 🌷</div>
    <div class="rule"></div>
    <div class="final-btns">
      <button class="btn" id="yes">إي... تنطيني فرصة ❤️</button>
      <button class="btn ghost" id="think">خليني أفكر 🥺</button>
    </div>`);
  mount(node).then(() => {
    document.getElementById("yes").onclick = celebrate;
    document.getElementById("think").onclick = takeTime;
  });
}

async function celebrate(){
  showFinalMessage("yes");
}
async function takeTime(){
  showFinalMessage("think");
}
async function showFinalMessage(kind){
  if(kind==="yes"){
    chime(); document.getElementById("glow").classList.add("on"); burst(60);
    const node = el(`<div class="line"></div><div class="line"></div><div class="line" style="color:var(--rose-deep)"></div>`, "card plain");
    const L = node.querySelectorAll(".line");
    L[0].textContent = "شكراً لأنج سمعتي قلبي... ❤️";
    L[1].textContent = "وأوعدج... مو بالكلام، بالأفعال.";
    L[2].textContent = "من أحمد إلى زهرة، دائماً. 🤍";
    await mount(node);
    await wait(500); L[0].classList.add("on");
    await wait(2800); L[1].classList.add("on");
    await wait(2800); L[2].classList.add("on");
    for(let i=0;i<4;i++){ await wait(3500); burst(14); }
  } else {
    const node = el(`<div class="line"></div><div class="line" style="font-size:21px;color:var(--soft)"></div>
      <div style="opacity:0;transition:opacity 1.5s;margin-top:22px" id="rb"><button class="btn" id="rs">أرجع للبداية ↺</button></div>`, "card plain");
    const L = node.querySelectorAll(".line");
    L[0].textContent = "اخذي وقتج... ❤️";
    L[1].textContent = "آني مو مستعجل على جواب، المهم تعرفين إن مشاعرج عندي مهمة.";
    await mount(node);
    await wait(500); L[0].classList.add("on");
    await wait(2600); L[1].classList.add("on");
    await wait(2600); node.querySelector("#rb").style.opacity = 1;
    document.getElementById("rs").onclick = restart;
  }
}
function restart(){
  idx = -1; busy = false; answers.length = 0;
  document.getElementById("glow").classList.remove("on");
  clearInterval(ambient);
  ambient = setInterval(() => floatHeart("🤍"), 1400);
  intro(); /* music keeps playing, never restarted */
}

intro();
</script>
</body>
